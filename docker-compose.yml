# Único arquivo de setup. Sobe tudo com:  docker compose up -d
# Pré-requisito: o PDF do livro em data/Livro.pdf
# Usa o Ollama do computador se ele estiver rodando (mais rápido); senão, o do container.
name: oraculo

services:
  # Ollama de backup, dentro do Docker (roda na CPU). Não publica porta, então não conflita
  # com o Ollama do computador.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 60

  # Baixa os modelos no Ollama do container (executa uma vez)
  models:
    image: ollama/ollama:latest
    entrypoint: ["sh", "-c"]
    command: ["ollama pull gemma4:e4b && ollama pull bge-m3"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy

  # Indexa o PDF (só roda se ainda não existir static/data.js)
  ingest:
    build: .
    image: oraculo-tools
    working_dir: /app
    environment:
      OLLAMA_CANDIDATES: "http://host.docker.internal:11434,http://ollama:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    command:
      - sh
      - -c
      - |
        if [ -f static/data.js ]; then echo "índice já existe, pulando"; exit 0; fi
        python ingest.py /app/data/Livro.pdf && python build_web_data.py
    depends_on:
      models:
        condition: service_completed_successfully

  # Carrega os modelos no Ollama escolhido, para a primeira pergunta sair rápida
  warmup:
    build: .
    image: oraculo-tools
    working_dir: /app
    environment:
      OLLAMA_CANDIDATES: "http://host.docker.internal:11434,http://ollama:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
    command: ["sh", "-c", "python warmup.py || echo 'aviso: não consegui aquecer os modelos'"]
    depends_on:
      models:
        condition: service_completed_successfully

  # A página do chat + proxy /api/ para o Ollama (do computador ou do container)
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      ingest:
        condition: service_completed_successfully
      warmup:
        condition: service_completed_successfully

volumes:
  ollama-models:
